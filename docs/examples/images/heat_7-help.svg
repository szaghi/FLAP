<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="842" viewBox="0 0 1284 842">
<rect width="1284" height="842" rx="8" fill="#282c34"/>
<circle cx="18" cy="16" r="6" fill="#ff5f56"/><circle cx="38" cy="16" r="6" fill="#ffbd2e"/>
<circle cx="58" cy="16" r="6" fill="#27c93f"/>
<text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#dcdfe4" xml:space="preserve">
<tspan x="18" y="59"><tspan fill="#98c379">$</tspan> heat --help</tspan>
<tspan x="18" y="78">usage: heat [--nx N] [--scheme value] [--help] [--markdown] [--version] [--man] [--show-completion [SHELL]] [--install-completion [SHELL]] {run} ...</tspan>
<tspan x="18" y="97"></tspan>
<tspan x="18" y="116">Solve the 2D heat equation on a square plate</tspan>
<tspan x="18" y="135"></tspan>
<tspan x="18" y="154">Optional switches:</tspan>
<tspan x="18" y="173">  <tspan fill="#56b6c2" font-weight="bold">--nx</tspan> N</tspan>
<tspan x="18" y="192">      default value 64</tspan>
<tspan x="18" y="211">      Cells along each direction</tspan>
<tspan x="18" y="230">  <tspan fill="#56b6c2" font-weight="bold">--scheme</tspan> value</tspan>
<tspan x="18" y="249">      choices: fe, cn</tspan>
<tspan x="18" y="268">      default value fe</tspan>
<tspan x="18" y="287">      Time scheme</tspan>
<tspan x="18" y="306">  --help, -h</tspan>
<tspan x="18" y="325">      Print this help message</tspan>
<tspan x="18" y="344">  --markdown, -md</tspan>
<tspan x="18" y="363">      Save this help message in a Markdown file</tspan>
<tspan x="18" y="382">  --version, -v</tspan>
<tspan x="18" y="401">      Print version</tspan>
<tspan x="18" y="420">  --man</tspan>
<tspan x="18" y="439">      Save this help message as a man page</tspan>
<tspan x="18" y="458">  --show-completion [SHELL]</tspan>
<tspan x="18" y="477">      choices: bash, zsh, fish, powershell</tspan>
<tspan x="18" y="496">      Print the completion script of SHELL (default: $SHELL)</tspan>
<tspan x="18" y="515">  --install-completion [SHELL]</tspan>
<tspan x="18" y="534">      choices: bash, zsh, fish, powershell</tspan>
<tspan x="18" y="553">      Install the completion script of SHELL (default: $SHELL) in $HOME</tspan>
<tspan x="18" y="572"></tspan>
<tspan x="18" y="591">Commands:</tspan>
<tspan x="18" y="610">  run</tspan>
<tspan x="18" y="629">      Run a simulation</tspan>
<tspan x="18" y="648"></tspan>
<tspan x="18" y="667">For more detailed commands help try:</tspan>
<tspan x="18" y="686">  heat run -h,--help</tspan>
<tspan x="18" y="705"></tspan>
<tspan x="18" y="724">Examples:</tspan>
<tspan x="18" y="743">  heat --nx 128 run</tspan>
<tspan x="18" y="762">  heat run --cfl 0.4</tspan>
<tspan x="18" y="781">  heat --install-completion</tspan>
<tspan x="18" y="800"></tspan>
<tspan x="18" y="819">Report bugs at https://example.org/heat/issues</tspan>
</text></svg>
