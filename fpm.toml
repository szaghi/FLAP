name = "FLAP"
version = "1.3.0"
author = "Stefano Zaghi"
copyright = "Copyright © 2016, Stefano Zaghi"
license = "Multiple licenses"
description = "Fortran command Line Arguments Parser for poor people"
maintainer = "Stefano Zaghi"
homepage = "https://github.com/szaghi/FLAP"

[dependencies]
FACE = { git="https://github.com/szaghi/FACE.git", rev="c91f6a7f777e629e27e3b5f0834bd514ee77c366" }
PENF = { git="https://github.com/szaghi/PENF.git", rev="f3067f771510938ea4f39afef502c3c4b846b54d" }

[library]
source-dir = "src/lib"

[install]
library = true

[build]
auto-executables = false
auto-examples = false
auto-tests = false

