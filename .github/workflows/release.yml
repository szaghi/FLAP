name: Release FLAP

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # a dispatch from a branch would publish a release named after the branch
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release tarball
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          VERSION="${{ github.ref_name }}"
          tar --xform="s%^%${REPO_NAME}-${VERSION}/%" -czf "${REPO_NAME}-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='docs/node_modules' \
            --exclude='docs/.vitepress/dist' \
            --exclude='docs/.vitepress/cache' \
            --exclude='exe' --exclude='obj' --exclude='mod' \
            *
          echo "TARBALL=${REPO_NAME}-${VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - "${{ github.ref_name }}" CHANGELOG.md > release_notes.md <<'PYEOF'
          import sys, re
          tag, path = sys.argv[1], sys.argv[2]
          with open(path) as f:
              content = f.read()
          # cliff.toml writes the heading without the tag's "v" prefix: accept both
          version = re.escape(tag[1:] if tag.startswith('v') else tag)
          pattern = rf'(^## \[v?{version}\].*?)(?=\n## |\Z)'
          match = re.search(pattern, content, re.DOTALL | re.MULTILINE)
          print(match.group(1).strip() if match else f"Release {tag}\n\nSee CHANGELOG.md for details.")
          PYEOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "FLAP ${{ github.ref_name }}"
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            ${{ env.TARBALL }}
            scripts/install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install:
    # run in this workflow: a release published with GITHUB_TOKEN triggers no workflow
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/install.yml
    with:
      tag: ${{ github.ref_name }}
